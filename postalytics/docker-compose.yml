version: "3.9"

services:
  # ── Base de données PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: postalytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postalytics
      POSTGRES_PASSWORD: postalytics
      POSTGRES_DB: postalytics_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: postalytics_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/DATABASE
      SECRET_KEY: ${SECRET_KEY:-***REDACTED_SECRET_DEFAULT***}
      GROQ_API_KEY: ***REVOKED_GROQ_KEY***
      GROQ_MODEL: llama-3.3-70b-versatile
      LLM_PROVIDER: groq
      APP_ENV: ${APP_ENV:-development}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # hot reload en développement
    command: >
      sh -c "
        python -m app.db.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Frontend React (dev) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: postalytics_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
